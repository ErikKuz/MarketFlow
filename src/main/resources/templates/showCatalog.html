<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Каталог | MarketFlow</title>
    <link rel="stylesheet" th:href="@{/css/market.css}" href="/css/market.css">
</head>
<body>
<header th:replace="~{workspace/fragments :: buyerMarketHeader('catalog')}"></header>

<main class="market-main">
    <div class="page-heading">
        <div>
            <p class="eyebrow">MarketFlow</p>
            <h1>Каталог товаров</h1>
            <p class="muted">Актуальные предложения продавцов.</p>
        </div>
        <a class="button button-secondary" th:href="@{/account/cart}" href="/account/cart">Перейти в корзину</a>
    </div>

    <section class="product-grid" th:if="${products != null and !products.isEmpty()}">
        <article class="product-card"
                 th:each="product : ${products}">
            <div class="product-media">
                <img th:if="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}"
                     th:src="${product.imageUrl}"
                     th:alt="${product.name}">
                <div class="product-placeholder"
                     th:unless="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}">
                    Нет изображения
                </div>
            </div>

            <div class="product-content">
                <h2 th:text="${product.name}">Название товара</h2>
                <p class="product-description" th:text="${product.description}">
                    Описание товара
                </p>
                <div class="price-row">
                    <span class="price" th:text="${product.price + ' ₽'}">0.00 ₽</span>
                    <span class="stock" th:text="${'В наличии: ' + product.quantity}">В наличии: 0</span>
                </div>
                <div class="card-actions">
                    <a class="button button-secondary"
                       th:href="@{/account/products/{id}(id=${product.id})}"
                       href="/account/products/1">
                        Подробнее
                    </a>
                    <form th:action="@{/account/cart/items/{id}(id=${product.id})}"
                          action="/account/cart/items/1"
                          method="post">
                        <button class="button button-primary" type="submit">В корзину</button>
                    </form>
                </div>
            </div>
        </article>
    </section>

    <section class="empty-state" th:if="${products == null or products.isEmpty()}">
        <h2>Каталог пока пуст</h2>
        <p class="muted">Товары появятся здесь после добавления продавцами.</p>
    </section>
</main>
</body>
</html>
