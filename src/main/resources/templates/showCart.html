<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Корзина | MarketFlow</title>
    <link rel="stylesheet" th:href="@{/css/market.css}" href="/css/market.css">
</head>
<body>
<header th:replace="~{workspace/fragments :: buyerMarketHeader('cart')}"></header>

<main class="market-main">
    <div class="page-heading">
        <div>
            <p class="eyebrow">Ваш выбор</p>
            <h1>Корзина</h1>
            <p class="muted">Проверьте выбранные позиции перед оформлением.</p>
        </div>
        <a class="button button-secondary" th:href="@{/account/catalog}" href="/account/catalog">Добавить товары</a>
    </div>

    <section class="data-panel" th:if="${cartItems != null and !cartItems.isEmpty()}">
        <div class="data-row" th:each="item : ${cartItems}">
            <div class="cart-product">
                <div class="cart-product-media">
                    <img th:if="${item.imageUrl != null and !#strings.isEmpty(item.imageUrl)}"
                         th:src="${item.imageUrl}"
                         th:alt="${item.productName}">
                    <span th:unless="${item.imageUrl != null and !#strings.isEmpty(item.imageUrl)}">Нет фото</span>
                </div>
                <div>
                    <div class="data-label">Товар</div>
                    <a class="data-value cart-product-link"
                       th:href="@{/account/products/{id}(id=${item.productId})}"
                       th:text="${item.productName}">
                        Название товара
                    </a>
                    <div class="cart-product-price" th:text="${item.price + ' ₽ за штуку'}">0.00 ₽ за штуку</div>
                </div>
            </div>
            <div>
                <div class="data-label">Количество</div>
                <div class="data-value" th:text="${item.quantity}">1</div>
                <div class="cart-product-price" th:text="${'Сумма: ' + item.subtotal + ' ₽'}">Сумма: 0.00 ₽</div>
            </div>
            <div class="card-actions">
                <form th:action="@{/account/cart/items/{id}/quantity(id=${item.id})}" method="post">
                    <input type="number" name="quantity" min="1" th:value="${item.quantity}"
                           th:attr="aria-label=${'Количество товара ' + item.productName}" required>
                    <button class="button button-secondary" type="submit">Изменить количество</button>
                </form>
                <form th:action="@{/account/cart/items/{id}/select(id=${item.id})}" method="post">
                    <input type="hidden" name="selected" th:value="${!item.selected}">
                    <button class="button button-secondary" type="submit"
                            th:text="${item.selected ? 'Снять выбор' : 'Выбрать'}">
                        Выбрать
                    </button>
                </form>
                <form th:action="@{/account/cart/items/{id}/delete(id=${item.id})}" method="post">
                    <button class="button button-danger" type="submit">Удалить</button>
                </form>
            </div>
        </div>
    </section>

    <section class="empty-state" th:if="${cartItems == null or cartItems.isEmpty()}">
        <h2>Корзина пуста</h2>
        <p class="muted">Добавьте товары из каталога, чтобы продолжить.</p>
    </section>

    <div class="summary-band" th:if="${cartItems != null and !cartItems.isEmpty()}">
        <div>
            <div class="data-label">Следующий шаг</div>
            <div class="data-value">Расчёт итоговой суммы</div>
        </div>
        <a class="button button-primary" th:href="@{/account/checkout}" href="/account/checkout">Перейти к оформлению</a>
    </div>
</main>
</body>
</html>
