<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Профиль | MarketFlow</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}" href="/css/auth.css">
    <link rel="stylesheet" th:href="@{/css/market.css}" href="/css/market.css">
</head>
<body>
    <header th:replace="~{workspace/fragments :: buyerMarketHeader('profile')}"></header>
    <main class="page-shell">
        <section class="profile-section" aria-labelledby="profile-title">
            <div>
                <p class="eyebrow">Личный кабинет</p>
                <h1 id="profile-title">Профиль пользователя</h1>
                <p class="supporting-text">Вы успешно вошли в MarketFlow.</p>
            </div>

            <dl class="profile-list">
                <div>
                    <dt>Имя</dt>
                    <dd th:text="${displayName}">Имя пользователя</dd>
                </div>
                <div>
                    <dt>Email</dt>
                    <dd th:text="${email}">Email пользователя</dd>
                </div>
                <div>
                    <dt>Статус</dt>
                    <dd th:text="${@uiLabels.userStatus(status)}">Активен</dd>
                </div>
            </dl>

            <div class="action-stack">
                <a class="button button-primary" th:if="${isSeller}" th:href="@{/seller/account}">
                    Перейти в кабинет продавца
                </a>
                <a class="button button-secondary" th:href="@{/notifications}">
                    🔔 Уведомления <span class="notification-count" data-unread-count hidden>0</span>
                </a>
                <a class="button button-secondary" th:href="@{/account/orders}">Мои заказы</a>
                <a class="button button-primary" th:href="@{/account/catalog}" href="/account/catalog">
                    Открыть каталог
                </a>
                <a class="button button-secondary" th:href="@{/account/cart}" href="/account/cart">
                    Открыть корзину
                </a>
                <a class="button button-secondary" th:href="@{/account/account/cards}" href="/account/account/cards">
                    Управление картами
                </a>
            </div>
        </section>
    </main>
</body>
</html>
