<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Товар | MarketFlow</title>
    <link rel="stylesheet" th:href="@{/css/market.css}" href="/css/market.css">
</head>
<body>
<header class="market-header">
    <a class="market-brand" th:href="@{/account/catalog}" href="/account/catalog">MarketFlow</a>
    <nav class="market-nav" aria-label="Основная навигация">
        <a th:href="@{/account/catalog}" href="/account/catalog">Каталог</a>
        <a th:href="@{/account/cart}" href="/account/cart">Корзина</a>
        <a th:href="@{/account/account/cards}" href="/account/account/cards">Карты</a>
        <a th:if="${isSeller}" th:href="@{/seller/account}" href="/seller/account">Кабинет продавца</a>
        <a th:href="@{/Buyer/account}" href="/Buyer/account">Профиль</a>
    </nav>
</header>

<main class="market-main">
    <section class="detail-layout">
        <div class="detail-media">
            <img th:if="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}"
                 th:src="${product.imageUrl}"
                 th:alt="${product.name}">
            <span th:unless="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}">Нет изображения</span>
        </div>
        <div class="detail-copy">
            <p class="eyebrow">Карточка товара</p>
            <h1 th:text="${product.name}">Информация о товаре</h1>
            <p class="detail-description" th:text="${product.description}">
                Подробное описание выбранного товара.
            </p>
            <div class="price-row">
                <span class="price" th:text="${product.price + ' ₽'}">0.00 ₽</span>
                <span class="stock" th:text="${'В наличии: ' + product.quantity}">В наличии: 0</span>
            </div>
            <div class="form-actions">
                <form th:action="@{/account/cart/items/{id}(id=${product.id})}" method="post">
                    <button class="button button-primary" type="submit">Добавить в корзину</button>
                </form>
                <a class="button button-secondary" th:href="@{/account/catalog}" href="/account/catalog">Вернуться в каталог</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
