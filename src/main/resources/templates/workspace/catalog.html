<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{workspace/fragments :: head('Каталог товаров')}"></head>
<body><nav th:replace="~{workspace/fragments :: nav}"></nav>
<main class="workspace"><h1>Каталог товаров</h1>
<form th:action="@{/catalog}" method="get" class="panel"><label>Название<input name="q" maxlength="200" th:value="${q}" placeholder="Поиск товара"></label>
<label>Цена от<input type="number" name="minPrice" min="0" step="0.01" th:value="${minPrice}"></label><label>Цена до<input type="number" name="maxPrice" min="0" step="0.01" th:value="${maxPrice}"></label>
<label>ID продавца<input type="number" name="sellerId" min="1" th:value="${sellerId}"></label>
<label>Сортировка<select name="sort"><option value="newest" th:selected="${sort == 'newest'}">Сначала новые</option><option value="priceAsc" th:selected="${sort == 'priceAsc'}">Цена: по возрастанию</option>
<option value="priceDesc" th:selected="${sort == 'priceDesc'}">Цена: по убыванию</option><option value="name" th:selected="${sort == 'name'}">По названию</option></select></label><button>Найти</button></form>
<div class="grid"><article class="card" th:each="p : ${products.content}"><img class="product" th:if="${p.imageUrl != null}" th:src="${p.imageUrl}" th:alt="${p.name}">
<h2 th:text="${p.name}"></h2><p th:text="${p.description}"></p><p class="metric" th:text="${p.price + ' ₽'}"></p><p th:text="${'В наличии: ' + p.quantity}"></p>
<a class="button" th:href="@{/account/products/{id}(id=${p.id})}">Открыть товар</a></article></div><p th:if="${products.content.isEmpty()}">По выбранным условиям ничего не найдено.</p>
<div class="pager"><a th:if="${products.page > 0}" th:href="@{/catalog(q=${q},minPrice=${minPrice},maxPrice=${maxPrice},sellerId=${sellerId},sort=${sort},page=${products.page - 1})}">← Назад</a>
<span th:text="${'Найдено: ' + products.totalElements}"></span>
<a th:if="${products.page + 1 < products.totalPages}" th:href="@{/catalog(q=${q},minPrice=${minPrice},maxPrice=${maxPrice},sellerId=${sellerId},sort=${sort},page=${products.page + 1})}">Далее →</a></div></main></body></html>
