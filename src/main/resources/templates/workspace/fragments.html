<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${title + ' | MarketFlow'}">MarketFlow</title><link rel="stylesheet" th:href="@{/css/workspace.css}">
<script th:src="@{/js/notifications.js}" defer></script></head>
<body>
<nav th:fragment="nav" class="nav"><a th:href="@{/Buyer/account}" class="brand">MarketFlow</a><a th:href="@{/account/catalog}">Каталог</a>
<a th:href="@{/account/orders}">Мои заказы</a>
<a class="notification-link" th:href="@{/notifications}">🔔 Уведомления <span class="notification-count" data-unread-count hidden>0</span></a>
<a th:if="${isSeller}" th:href="@{/seller/account}">Кабинет продавца</a>
<a th:href="@{/Buyer/account}">Личный кабинет</a></nav>
<nav th:fragment="sellerNav" class="nav"><a th:href="@{/seller/account}" class="brand">MarketFlow Seller</a>
<a th:href="@{/workspace/seller/orders}">Заказы</a>
<a th:href="@{/seller/account}">Мои товары</a>
<a th:href="@{/seller/wallet}">Кошелёк</a>
<a class="notification-link" th:href="@{/notifications}">🔔 Уведомления <span class="notification-count" data-unread-count hidden>0</span></a>
<a th:href="@{/account/catalog}">Режим покупателя</a>
<form th:action="@{/logout}" method="post"><button type="submit">Выйти</button></form></nav>
<div th:fragment="pager(page, base)" class="pager">
<a th:if="${page.page > 0}" th:href="@{${base}(page=${page.page - 1})}">← Предыдущая</a>
<span th:text="${'Страница ' + (page.page + 1) + ' · Всего записей: ' + page.totalElements}"></span>
<a th:if="${page.page + 1 < page.totalPages}" th:href="@{${base}(page=${page.page + 1})}">Следующая →</a></div>
</body></html>
