<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{workspace/fragments :: head('Доставка заказа')}"></head>
<body><nav th:replace="~{workspace/fragments :: nav}"></nav>
<main class="workspace"><h1>Доставка заказа</h1>
<p><a th:href="@{/account/orders/{id}(id=${order.id})}">← Состав заказа и оплата</a></p>
<div class="panel"><h2 th:text="${'Заказ #' + order.id}"></h2><p><span th:text="${order.status}"></span> · Оплата: <span th:text="${order.paymentStatus}"></span> · <b th:text="${order.totalPrice + ' ₽'}"></b></p>
</div>
<h2>Части заказа по продавцам</h2><div class="grid"><section class="card" th:each="p : ${parts}">
<h3 th:text="${'Продавец #' + p.sellerId}"></h3><p th:text="${p.status}"></p><p th:text="${p.totalAmount + ' ₽'}"></p>
<form th:if="${p.status.name() == 'SELLERSENDPRODUCT' and order.paymentStatus.name() == 'PAID'}" th:action="@{/account/orders/{id}/fulfillments/{partId}/receive(id=${order.id},partId=${p.id})}" method="post">
<button type="submit">Подтвердить получение</button></form></section></div>
</main></body></html>
