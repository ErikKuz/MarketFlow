<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Добавить товар | MarketFlow</title>
    <link rel="stylesheet" th:href="@{/css/market.css}" href="/css/market.css">
</head>
<body>
<header th:replace="~{workspace/fragments :: sellerMarketHeader('new-product')}"></header>

<main class="form-wrap">
    <section class="form-shell">
        <p class="eyebrow">Новый товар</p>
        <h1>Добавить товар</h1>
        <p class="muted">Заполните информацию, которая будет показана покупателям.</p>

        <form class="market-form"
              th:action="@{/seller/products}"
              action="/seller/products"
              th:object="${product}"
              method="post">

            <div class="field">
                <label for="name">Название</label>
                <input id="name" type="text" th:field="*{name}" maxlength="200" required>
                <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Ошибка названия</p>
            </div>

            <div class="field">
                <label for="description">Описание</label>
                <textarea id="description" th:field="*{description}" rows="5"></textarea>
                <p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Ошибка описания</p>
            </div>

            <div class="field">
                <label for="price">Цена для покупателя</label>
                <input id="price" type="number" th:field="*{price}" min="0.01" step="0.01" required>
                <p class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Ошибка цены</p>
            </div>

            <div class="field">
                <label for="quantity">Начальный остаток</label>
                <input id="quantity" type="number" th:field="*{quantity}" min="0" step="1" required>
                <p class="field-error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}">Ошибка количества</p>
            </div>

            <div class="field">
                <label for="imageUrl">Ссылка на изображение</label>
                <input id="imageUrl" type="url" th:field="*{imageUrl}" maxlength="1000">
                <p class="field-error" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}">Ошибка ссылки</p>
            </div>

            <div class="form-actions">
                <button class="button button-primary" type="submit">Сохранить товар</button>
                <a class="button button-secondary" th:href="@{/seller/account}" href="/seller/account">Отмена</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
