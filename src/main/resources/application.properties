spring.application.name=marketflow
# Подключаем локальный файл .env
spring.config.import=optional:file:./.env[.properties],optional:file:./marketflow/.env[.properties]

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_LISTENERS_ENABLED:true}

# Публикация Transactional Outbox
marketflow.outbox.enabled=${RABBITMQ_OUTBOX_ENABLED:true}
marketflow.outbox.delay=1000
marketflow.outbox.batch-size=50
marketflow.outbox.max-attempts=5
marketflow.outbox.confirm-timeout=10s

# Redis: временный кеш каталога, PostgreSQL остаётся источником данных
spring.cache.type=${CACHE_TYPE:redis}
spring.cache.cache-names=catalogProducts,catalogProduct
spring.cache.redis.time-to-live=${REDIS_CATALOG_TTL:60s}
spring.cache.redis.cache-null-values=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false

# Серверная HTTP-сессия
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
