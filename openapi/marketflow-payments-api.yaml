openapi: 3.0.3

info:
  title: MarketFlow Order Payments API
  version: 0.3.0
  description: >
    Simulated card payment, not a banking integration. In one transaction it debits stock
    and the buyer card, records PAYMENT, accrues seller funds and platform commission to
    pending wallet balances, and records the corresponding ledger entries.
    Reusing a successful key with the same order, user and card returns the original result.
    A failed balance-check key remains failed; use a new key after adding funds.
    A seller can withdraw available virtual funds to their own simulated card.

servers:
  - url: http://localhost:8080

tags:
  - name: Payments
  - name: Wallets

security:
  - sessionCookie: []

paths:
  /api/v1/orders/{orderId}/payment:
    get:
      tags: [Payments]
      summary: Get payment data for an order
      operationId: getPayment
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Payment data returned successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentPage' }
        '400': { $ref: '#/components/responses/InvalidOrderId' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/PaymentConflict' }
    post:
      tags: [Payments]
      summary: Pay for an order
      operationId: payOrder
      parameters:
        - name: X-CSRF-TOKEN
          in: header
          required: true
          description: Token from GET /api/v1/csrf for the same session
          schema: { type: string }
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayOrderRequest' }
      responses:
        '200':
          description: Payment completed, including an idempotent repeated request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResult' }
        '400': { $ref: '#/components/responses/ValidationErrorResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/PaymentResourceNotFound' }
        '409': { $ref: '#/components/responses/PaymentConflict' }

  /api/v1/wallet/withdraw:
    post:
      tags: [Wallets]
      summary: Withdraw available seller funds to a simulated card
      operationId: withdrawSellerFunds
      parameters:
        - name: X-CSRF-TOKEN
          in: header
          required: true
          description: Token from GET /api/v1/csrf for the same session
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithdrawRequest' }
      responses:
        '204':
          description: Funds withdrawn; an identical repeated request is a no-op
        '400': { $ref: '#/components/responses/ValidationErrorResponse' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/PaymentResourceNotFound' }
        '409': { $ref: '#/components/responses/PaymentConflict' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID

  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }

  schemas:
    PayOrderRequest:
      type: object
      required: [cardId, idempotencyKey]
      properties:
        cardId: { type: integer, format: int64, minimum: 1 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 100 }

    WithdrawRequest:
      type: object
      required: [cardId, amount, idempotencyKey]
      properties:
        cardId: { type: integer, format: int64, minimum: 1 }
        amount: { type: number, minimum: 0, exclusiveMinimum: true, multipleOf: 0.01 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 150 }

    PaymentResult:
      type: object
      required: [orderId]
      properties:
        orderId: { type: integer, format: int64, minimum: 1 }

    PaymentPage:
      type: object
      required: [orderId, totalPrice, paymentStatus, cards, idempotencyKey]
      properties:
        orderId: { type: integer, format: int64, minimum: 1 }
        totalPrice: { type: number, minimum: 0, exclusiveMinimum: true, multipleOf: 0.01 }
        paymentStatus:
          type: string
          enum: [NOT_PAID, PROCESSING, PAID, FAILED, REFUNDED]
        cards:
          type: array
          items: { $ref: '#/components/schemas/PaymentCardOption' }
        idempotencyKey: { type: string, minLength: 1, maxLength: 100 }

    PaymentCardOption:
      type: object
      required: [id, maskedNumber, balance]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        maskedNumber: { type: string, minLength: 1, maxLength: 30 }
        balance: { type: number, minimum: 0, multipleOf: 0.01 }

    ApiError:
      type: object
      required: [timestamp, status, code, message, path, validationErrors]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer, format: int32 }
        code: { type: string }
        message: { type: string }
        path: { type: string }
        validationErrors: { type: array, items: { $ref: '#/components/schemas/ValidationError' } }
        traceId: { type: string, nullable: true }
    ValidationError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }

  responses:
    ValidationErrorResponse:
      description: Order ID, card ID, idempotency key, or JSON body is invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    InvalidOrderId:
      description: Order ID has an invalid value or format
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    AuthenticationRequired:
      description: Authentication is required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    OrderNotFound:
      description: Order does not exist or does not belong to this buyer
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    PaymentResourceNotFound:
      description: Order or selected payment card was not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    PaymentConflict:
      description: Funds or stock are insufficient, product is inactive, an idempotency key conflicts, or the order state does not allow payment
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Required role is missing or the CSRF token is missing/invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
